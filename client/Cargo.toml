[package]
name = "colloquy-client"
version.workspace = true
edition.workspace = true
license.workspace = true

# The poker. Deliberately thin on dependencies: its job is to keep working when
# other things have gone wrong, and every crate here is one the eventual client
# may not want.
[[bin]]
name = "colloquy"
path = "src/main.rs"

[dependencies]
colloquy-proto = { path = "../proto" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
